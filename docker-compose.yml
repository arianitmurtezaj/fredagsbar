services:
  api:
    build: .
    command: python api.py
    ports:
      - "5002:5002"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5002/events', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  frontend:
    build: .
    command: streamlit run app.py --server.address=0.0.0.0 --server.port=8501 --server.headless=true --browser.gatherUsageStats=false
    ports:
      - "8501:8501"
    environment:
      API_URL: http://api:5002
    depends_on:
      api:
        condition: service_healthy
